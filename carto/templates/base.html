{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}GeoCommune{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="{% static 'css/theme.css' %}">
    {% block extra_css %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">

    {% block navbar %}
    <nav id="navbar-sig" class="navbar navbar-expand-lg navbar-dark shadow-sm px-4">
        <a class="navbar-brand d-flex align-items-center" href="{% url 'carte_index' %}">
            <i class="fa-solid fa-map-location-dot me-3 fa-lg" style="color: var(--color-accent);"></i>
            <div>
                <span class="fw-bold d-block" style="letter-spacing: 0.5px;">GeoCommune</span>
                <small class="text-white-50 fw-light" style="font-size: 11px;">Système d'Information Géographique Communal</small>
            </div>
        </a>
    </nav>
    {% endblock navbar %}

    {% block content %}{% endblock %}

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
