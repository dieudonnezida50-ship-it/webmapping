{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Système de Gestion Communale - Connexion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(180deg, #f4f7f6 0%, #e9ecef 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            background-color: #ffffff;
            overflow: hidden;
            max-width: 480px;
            width: 100%;
        }
        .card-header-custom {
            background-color: #ffffff;
            border-bottom: 1px solid #f2f4f3;
            padding: 2.5rem 2rem 1.5rem 2rem;
            text-center: center;
        }
        .brand-logo {
            width: 60px;
            height: 60px;
            background-color: #e6f7ff;
            color: #007bff;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            margin: 0 auto 1.2rem auto;
        }
        .form-control-custom {
            background-color: #f8f9fa;
            border: 1px solid #e9ecef;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }
        .form-control-custom:focus {
            background-color: #ffffff;
            border-color: #007bff;
            box-shadow: 0 0 0 4px rgba(0, 123, 255, 0.1);
            outline: none;
        }
        .input-group-icon {
            position: relative;
        }
        .input-group-icon i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #6c757d;
            z-index: 10;
        }
        .input-group-icon .form-control-custom {
            padding-left: 2.75rem;
        }
        .btn-submit {
            background: linear-gradient(135deg, #007bff 0%, #0056b3 100%);
            border: none;
            color: white;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-weight: 500;
            font-size: 1rem;
            transition: all 0.2s ease;
        }
        .btn-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(0, 123, 255, 0.2);
        }
    </style>
</head>
<body>

<div class="container p-3">
    <div class="login-card mx-auto">
        
        <div class="card-header-custom text-center">
            <div class="brand-logo shadow-sm">
                <i class="fa-solid fa-map-location-dot"></i>
            </div>
            <h4 class="fw-bold text-dark mb-1">Système d'Information Géographique</h4>
            <p class="text-muted small mb-0">Gestion et suivi du patrimoine infrastructurel communal</p>
        </div>

        <div class="card-body p-4 p-md-5 pt-4">
            
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} border-0 small rounded-3 mb-4 d-flex align-items-center" role="alert">
                        <i class="fa-solid fa-circle-exclamation me-2"></i>
                        <div>{{ message }}</div>
                    </div>
                {% endfor %}
            {% endif %}

            <form method="POST" autocomplete="off">
                {% csrf_token %}
                
                <div class="mb-3.5">
                    <label for="username" class="form-label fw-semibold text-secondary small">Identifiant de connexion</label>
                    <div class="input-group-icon">
                        <i class="fa-regular fa-user"></i>
                        <input type="text" name="username" id="username" class="form-control form-control-custom w-100" placeholder="Ex: f.traore" required>
                    </div>
                </div>

                <div class="mb-4 mt-3">
                    <label for="password" class="form-label fw-semibold text-secondary small">Mot de passe</label>
                    <div class="input-group-icon">
                        <i class="fa-solid fa-lock-open"></i>
                        <input type="password" name="password" id="password" class="form-control form-control-custom w-100" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-submit w-100 mt-2 shadow-sm">
                    <i class="fa-solid fa-right-to-bracket me-2"></i>Accéder à l'espace de travail
                </button>
            </form>
        </div>
        
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
